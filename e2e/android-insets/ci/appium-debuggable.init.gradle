// Harness-only override: keep the app's APPIUM=true flavor while enabling WebView CDP.
allprojects { appProject ->
    appProject.plugins.withId('com.android.application') {
        def androidExtension = appProject.extensions.getByName('android')
        androidExtension.buildTypes.whenObjectAdded { buildType ->
            if (buildType.name == 'appium') {
                buildType.debuggable = true
            }
        }
        def appiumBuildType = androidExtension.buildTypes.findByName('appium')
        if (appiumBuildType != null) {
            appiumBuildType.debuggable = true
        }
    }
}
